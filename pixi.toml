[workspace]
name = "hospital-clinical-analytics"
version = "0.1.0"
description = "End-to-End Hospital Readmission & Clinical Risk Intelligence with Marimo, DuckDB, and Scikit-Learn"
authors = ["Haider <portfolio@example.com>"]
channels = ["conda-forge"]
platforms = ["linux-64"]

[dependencies]
python = ">=3.11,<3.13"
duckdb = ">=1.0.0"
pandas = ">=2.0.0"
numpy = ">=1.24.0"
scikit-learn = ">=1.3.0"
plotly = ">=5.18.0"
marimo = ">=0.9.0"
pyarrow = ">=14.0.0"
pytest = ">=7.4.0"
requests = ">=2.31.0"

[tasks]
app = "marimo run app.py --port 8000"
edit = "marimo edit app.py"
widgets = "marimo run marimo_widgets_showcase.py --port 8001"
edit-widgets = "marimo edit marimo_widgets_showcase.py"
wasm = "marimo export html-wasm app.py -o app.wasm.html"
test = "pytest tests/ -v"
ingest = "python -m src.data_loader"
